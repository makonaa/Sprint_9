name: API CI/CD

on:
  push:
    branches: [ "main", "development"]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repo
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run tests
        run: pytest

  docker-and-e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Download repo
        uses: actions/checkout@v4

      - name: Pull Selenoid browser images
        run: docker pull selenoid/chrome:128.0

      - name: Run E2E tests via Docker Compose
        run: docker compose up --build --abort-on-container-exit --exit-code-from autotests